# RESO Transport Proposals: the canonical, maintained index of RCPs.
#
# Read by the site (index.html renders this list) and by AI agents and reference
# pages (for example identifiers.md), so proposal links and status live in one
# place and never drift. Edit one entry here and every consumer updates.
#
# Fields per proposal:
#   name       human-readable proposal name
#   rcp        RCP number(s), for example "RCP-50"
#   slug       URL / file slug
#   status     ratified | in-progress   (machine enum; drives the site section and link handling)
#   version    current version, when known
#   date       "YYYY-MM" ratified or submitted, when known
#   summary    one-line neutral description of what the proposal does
#   link       canonical "View" URL: "/proposals/<slug>/" when ratified, otherwise the
#              proposal's branch file, GitHub issue, discussion or pull request
#   link_type  spec | branch | issue | discussion | pull   (machine enum)
#
# When a proposal ratifies: set status to "ratified" and link to "/proposals/<slug>/"
# (link_type: spec). Audit these links and statuses with the registry
# "transport-proposals-audit" skill.

proposals:
  # ── Ratified ─────────────────────────────────────────────────────────────
  - name: "Web API Core"
    rcp: "RCP-37"
    slug: "web-api-core"
    status: "ratified"
    version: "2.1.0"
    date: "2023-12"
    summary: "The primary functionality RESO Web API servers must support for replication and live query, based on OData 4.0/4.01 with strict XML metadata validation, JSON responses and OAuth2 authentication."
    link: "/proposals/web-api-core/"
    link_type: "spec"

  - name: "Data Dictionary"
    rcp: "RCP-36/40"
    slug: "data-dictionary"
    status: "ratified"
    version: "2.0"
    date: "2023-11"
    summary: "The standard resources, fields, lookups and resource relationships in the RESO domain; version 2.0 adds heuristic name and value validation plus enforcement of payload data against advertised server metadata."
    link: "/proposals/data-dictionary/"
    link_type: "spec"

  - name: "Web API Add/Edit"
    rcp: "RCP-10"
    slug: "web-api-add-edit"
    status: "ratified"
    version: "2.0.0"
    date: "2023-12"
    summary: "Standard create, update and delete actions for the RESO Web API using the POST, PATCH and DELETE HTTP verbs, with standard error responses so interactive clients can surface business-rule issues to users."
    link: "/proposals/web-api-add-edit/"
    link_type: "spec"

  - name: "EntityEvent Resource and Replication"
    rcp: "RCP-27"
    slug: "entity-events"
    status: "ratified"
    version: "2.0.2"
    date: "2023-12"
    summary: "An append-only event log that lets data producers publish create, update and delete events so consumers replicate listing and related data using a monotonic EntityEventSequence instead of modification timestamps and state inference."
    link: "/proposals/entity-events/"
    link_type: "spec"

  - name: "Push Replication with Webhooks"
    rcp: "RCP-28"
    slug: "webhooks-push"
    status: "ratified"
    version: "1.0.1"
    date: "2023-12"
    summary: "Push replication of the EntityEvent Resource: data producers push events to consumer APIs using HTTP POST webhooks and RESO Common Format payloads instead of the consumer polling for updates."
    link: "/proposals/webhooks-push/"
    link_type: "spec"

  - name: "Validation Expressions"
    rcp: "RCP-19"
    slug: "validation-expressions"
    status: "ratified"
    version: "1.0.0"
    date: "2023-12"
    summary: "A machine-executable business rules grammar in Backus-Naur Form plus a transport mechanism to convey validation, process and display rules for records exchanged over the RESO Web API."
    link: "/proposals/validation-expressions/"
    link_type: "spec"

  - name: "RESO Common Format"
    rcp: "RCP-25"
    slug: "reso-common-format"
    status: "ratified"
    version: "1.7"
    date: "2023-11"
    summary: "A normative JSON data format aligned with the RESO Data Dictionary, using a RESO URN context variable (@reso.context) to declare the resource model and version so payloads stay interoperable across the Web API and other data sources."
    link: "/proposals/reso-common-format/"
    link_type: "spec"

  # ── In progress ──────────────────────────────────────────────────────────
  - name: "Autofill Service"
    rcp: "RCP-22"
    slug: "autofill-service"
    status: "in-progress"
    version: "1.0.0"
    summary: "A Lightweight Autofill Object: an endpoint returning Data Dictionary JSON that service providers give agents so MLS listing input forms can auto-populate property fields such as room dimensions and floor areas."
    link: "https://github.com/RESOStandards/transport/blob/a81fc4142f503499a73d84f67c9ced29ace6a70a/autofill-service.md"
    link_type: "branch"

  - name: "Supporting Single Feeds"
    rcp: "RCP-35"
    slug: "rcp-035-single-feeds"
    status: "in-progress"
    version: "1.0.0"
    summary: "Adds a FeedTypes open enumeration and a FeedRules complex-type collection to data resources and the Field metadata resource so consumers can consolidate IDX, VOW, BBO and PDAP feeds into one set of credentials while respecting per-record and per-field licensing."
    link: "https://github.com/RESOStandards/transport/blob/e222c800f2e6ef091fe6c334ce5160456a4e5c56/proposals/rcp-035-single-feeds.md"
    link_type: "branch"

  - name: "Model and Field Resources"
    rcp: "RCP-42"
    slug: "model-and-field-resources"
    status: "in-progress"
    version: "1.0.0"
    summary: "Adds a Model Resource and extends the Field Resource so server metadata can advertise capabilities such as searchability and updatability in a standard, transport-agnostic form, deprecating ResourceName in favor of ModelKey and DisplayName in favor of the DisplayNames collection."
    link: "https://github.com/RESOStandards/transport/blob/b21579a147a476a95fb0a9457ab6b23d5b7afc0a/proposals/model-and-field-resources.md"
    link_type: "branch"

  - name: "Local Fields and Predictability"
    rcp: "RCP-43"
    slug: "local-fields"
    status: "in-progress"
    version: "1.0.0"
    summary: "A standard expanded field named LocalData that can be added to any resource such as Property or Member, giving a predictable one-to-one convention for exposing provider-specific local fields alongside standard resources."
    link: "https://github.com/RESOStandards/transport/issues/77"
    link_type: "issue"

  - name: "Metadata Internationalization and Locale"
    rcp: "RCP-44"
    slug: "metadata-locales"
    status: "in-progress"
    version: "1.0.0"
    summary: "Locale-specific display names for Data Dictionary metadata using ISO locale identifiers, adding an I18nString OData complex type and a DisplayNames collection to the Model, Field and Lookup resources."
    link: "https://github.com/RESOStandards/transport/blob/fb879c1e60d517e7f139d5face97262055ab7242/proposals/metadata-locales.md"
    link_type: "branch"

  - name: "Legacy and Deprecated Data Elements"
    rcp: "RCP-45"
    slug: "rcp-45-legacy-deprecated-fields-lookups"
    status: "in-progress"
    version: "1.0.0"
    summary: "Extends the Field and Lookup resources with status metadata (FieldStatus / LookupStatus, StatusDate and ReplacedBy references) so servers can convey new and deprecated fields and lookup values to data consumers."
    link: "https://github.com/RESOStandards/transport/blob/ddb8bc9792173ef1a1d57eb5cb560af21d0fc558/proposals/rcp-45-legacy-deprecated-fields-lookups.md"
    link_type: "branch"

  - name: "RelatedLookup Resource"
    rcp: "RCP-47"
    slug: "related-lookups"
    status: "in-progress"
    version: "1.0.0"
    summary: "A RelatedLookup Resource that models directed relationships between Lookup Resource items so consumers can tell which enumerated values go together, for example which counties belong to a state or which schools belong to a county."
    link: "https://github.com/RESOStandards/transport/blob/015bd6181a3a9f56b1c5b767685761a842e0284c/proposals/related-lookups.md"
    link_type: "branch"

  - name: "Add/Edit with Media"
    rcp: "RCP-48"
    slug: "web-api-add-edit-with-media"
    status: "in-progress"
    version: "1.0.0"
    summary: "A Web API method for adding and editing Media binary byte-stream data such as photos, documents and videos using the existing Add/Edit process and OData streams, with a MediaStatusDescription field to communicate deferred post-processing state."
    link: "https://github.com/RESOStandards/transport/blob/fc35c711487bcd59ffecd02780feb56269fabd73/proposals/web-api-add-edit-with-media.md"
    link_type: "branch"

  - name: "EntityEvent Subscriptions and Filtering"
    rcp: "RCP-49"
    slug: "entity-event-subscriptions"
    status: "in-progress"
    version: "1.0.0"
    summary: "Extends the EntityEvent Resource with an EventTypes array for event filtering and adds an EntityEventSubscription Resource to create, update and remove filtered webhook push subscriptions."
    link: "https://github.com/RESOStandards/transport/issues/142"
    link_type: "issue"

  - name: "Data Provenance"
    rcp: "RCP-50"
    slug: "data-provenance"
    status: "in-progress"
    version: "1.0.0"
    summary: "A Provenance resource and expansion that record a record's ownership history across systems using RESO Unique Organization and System Identifiers (UOIs and USIs), without affecting the existing OriginatingSystem and SourceSystem fields."
    link: "https://github.com/RESOStandards/transport/blob/3cf737522b513e4e3591c73f3c0abdf5d0f31170/proposals/data-provenance.md"
    link_type: "branch"

  - name: "DOM Increment"
    rcp: "RCP-51"
    slug: "dom-increment"
    status: "in-progress"
    version: "1.0.0"
    summary: "A Days on Market endorsement that adds Property fields for Days on Market and Cumulative Days on Market plus a client-side calculation method, letting consumers derive current values without daily reingests and without MLSs disclosing their calculation rules."
    link: "https://github.com/RESOStandards/transport/pull/157"
    link_type: "pull"

  - name: "Listing Advertisement"
    rcp: "RCP-52"
    slug: "listing-advertisement"
    status: "in-progress"
    version: "1.0.0"
    summary: "Applies the W3C ActivityPub standard to make listing data exchange threaded and event-based across premarketing, marketing, showing and offer activities, with RESO certification for participating providers."
    link: "https://github.com/RESOStandards/transport/discussions/162"
    link_type: "discussion"

  - name: "Media Checksums"
    rcp: "RCP-53"
    slug: "media-checksums"
    status: "in-progress"
    date: "2025-05"
    summary: "Adds a checksum collection to the Media resource, each entry pairing a checksum algorithm type with its output value, so clients can detect unchanged media byte streams and skip redundant re-fetching."
    link: "https://github.com/RESOStandards/transport/issues/164"
    link_type: "issue"

  - name: "ULI Resolution Protocol"
    rcp: "RCP-54"
    slug: "uli-resolution-protocol"
    status: "in-progress"
    version: "0.1.0"
    summary: "A threaded, event-based protocol over W3C ActivityPub in which certified resolvers match broadcast licensees and reach consensus to mint or adopt a Unique Licensee Identifier (ULI), storing no licensee data on the network."
    link: "https://github.com/RESOStandards/transport/blob/294c02dad6b5aa448694b68e6fbf4b63126f1d1e/proposals/uli-resolution-protocol.md"
    link_type: "branch"

  - name: "Organization and System Identifiers"
    rcp: "RCP-55"
    slug: "org-system-identifiers"
    status: "in-progress"
    version: "1.0.0"
    summary: "Standard identifiers for organizations (the Unique Organization Identifier, UOI) and systems (the Unique System Identifier, USI), each backed by a new resource, deprecating the OUID Resource and replacing the OriginatingSystem and SourceSystem fields with standardized OriginatingUoi/OriginatingUsi and SourceUoi/SourceUsi identifiers."
    link: "https://github.com/RESOStandards/transport/blob/46619fdd2d383938ef86c6efff0f01e82c19d6c0/proposals/org-system-identifiers.md"
    link_type: "branch"
